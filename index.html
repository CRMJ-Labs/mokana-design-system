<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MOK Design System: fundamentos, componentes y patrones para construir interfaces coherentes." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>html{background:oklch(0.9702 0 0);color-scheme:light}html[data-theme=dark]{background:oklch(12% 0.005 285.823);color-scheme:dark}</style>
    <script>
      // Runs before first paint, so dark mode never flashes white while the app loads.
      (function(){var stored=null;try{stored=localStorage.getItem('mok-theme');}catch(error){}
      var theme=stored==='light'||stored==='dark'?stored:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
      document.documentElement.setAttribute('data-theme',theme);})();
    </script>
    <title>MOK Design System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/website.tsx"></script>
  </body>
</html>
