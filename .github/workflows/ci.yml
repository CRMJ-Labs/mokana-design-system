name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Complete verification
    # Match the OS used to review and generate the visual baselines.
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify docs, types, builds, UI, components and installed consumer
        run: npm run verify:ci
