name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install dependencies
        # npm install resolves the platform-specific optional packages required on Linux.
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Component tests
        run: npm test

      - name: Build package
        run: npm run build
