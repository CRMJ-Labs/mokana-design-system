name: Publish package

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # provenance de npm

jobs:
  publish:
    name: Publish to npm
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.0
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check tag matches package version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Install Microsoft Edge and browser dependencies
        run: npx playwright install --with-deps msedge

      - name: Verify docs, types, builds, UI, components and installed consumer
        run: npm run verify

      - name: Upload visual comparisons
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-visual-comparisons
          path: |
            verification/visual-report
            test-results/visual
          if-no-files-found: ignore

      - name: Publish
        # Verification already ran above; avoid repeating prepublishOnly.
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
